# Temporary capture-only config for the six USB cameras currently attached.
# C920 devices use stable by-id links. 1080P USB Camera devices use by-path
# links because several units expose the same generic serial identity.
# Do not use this as a calibrated camera layout and do not replace cameras.yaml
# until six-camera intrinsics, extrinsics, and static 3D validation pass.

cameras:
  camUsb01_C920:
    device: /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_9718C21F-video-index0
  camUsb02_1080P:
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:11.1:1.0-video-index0
  camUsb03_C920:
    device: /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_7B879F0F-video-index0
  camUsb04_1080P:
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:5.1:1.0-video-index0
  camUsb05_1080P:
    # re-mapped 2026-06-25 (was .7.1.1) after BLM-driven re-plug; verified by tag signature
    # (sees North 7/8/9 + East/West, no South). Deep hub (.6.1.1.1) — may be flaky.
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:6.1.1.1:1.0-video-index0
  camUsb06_1080P:
    # re-enumerated 2026-06-25: was .6.1.1.1 (3 hubs deep, node vanished), now .4.1.1.
    # NOTE: all 1080P units share serial SN0002, so by-id is AMBIGUOUS -> use by-path.
    # If this camera is replugged, re-map via scripts/identify_cameras.py.
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:4.1.1:1.0-video-index0
