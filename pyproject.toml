[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-cam"
version = "0.1.0"
description = "Multi-camera real-time 3D pose/ball tracking with predictive ballistics, an aim-only API, monitoring, and reproducible benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Hanush" }]
keywords = ["computer-vision", "pose-estimation", "triangulation", "edge-ai", "tensorrt", "yolo"]

# Core runtime deps are pinned in requirements.txt / requirements.lock.txt.
# This declares the hardware-free import surface so `pip install -e .` and the
# Docker CPU image resolve `import project_cam` without the live model stack.
dependencies = [
    "numpy>=1.26,<2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Production service layer (FastAPI + Prometheus). Kept optional so the core
# geometry package and its tests stay importable on a minimal install.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]
# Test + lint tooling for CI.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_cam*"]

[tool.pytest.ini_options]
# Make `pytest` work without an explicit PYTHONPATH. "src" exposes the
# project_cam package; "." exposes the repo-root `services` (and `benchmarks`)
# packages the API tests import. The bare `pytest` console script CI runs does
# NOT add the CWD to sys.path (unlike `python -m pytest`), so without "." here
# `from services.api.app.main import app` fails collection with exit code 2.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# The legacy script trees are excluded from lint; the curated package + service
# layer are the production surface that CI gates on.
src = ["src", "services", "benchmarks"]
extend-exclude = [
    "archive",
    "Parallel_working",
    "garage_lab_combined",
    "proxiball_3d-main",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
