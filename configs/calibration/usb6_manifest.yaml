# 6-camera calibration manifest (Phase 0 promotion tracker).
#
# Single place that records WHERE the 6-camera calibration artifacts live and
# WHICH promotion gates have passed. Fill the `gates` block from real runs of
# scripts/usb6_capture_gate.py + scripts/solve_extrinsics_usb6.py + the static
# 3D GT validation. Until every gate is true, status stays `prototype` and the
# 4-camera profile remains the runtime fallback.

profile: usb6
units: mm
status: prototype

resolution: [1280, 720]      # intrinsics MUST be calibrated at the live resolution

artifacts:
  intrinsics_dir: garage_lab_combined/cal/intrinsics_usb6_1280x720
  extrinsics: garage_lab_combined/cal/extrinsics_usb6/extrinsics_usb6.json
  extrinsics_mirrored: garage_lab_combined/cal/extrinsics_usb6/extrinsics_20260623_105831_mirrored.json
  dimensions: garage_lab_combined/cal/extrinsics_usb6/Dimensions_mirrored_y.txt

# Phase 0 acceptance gates (see PROJECT_IMPROVEMENT_PLAN). All production
# promotion gates must pass before any 6-camera production accuracy claim.
gates:
  # 2026-06-29: frame-health portion passed (all six opened, min fresh FPS
  # 16.51, max gap 81.11 ms, zero >100 ms gaps), but full capture gate failed
  # because all cameras still enumerate under one USB controller.
  capture_gate_passed: false
  capture_ok: true                 # 30 s gate, no camera drops, max_gap_ms <= 100
  usb_controller_split_ok: false
  all_intrinsics_at_runtime_res: true
  all_extrinsics_solved: true
  mean_reprojection_px_under_25: true
  static_3d_gt_mean_mm: null       # blocked: no six-camera static-GT trials found
  static_3d_gt_p95_mm: null        # blocked: no six-camera static-GT trials found
  four_cam_fallback_runs: true     # the 4-cam path stays runnable regardless

# Measured numbers go here once the gate scripts have been run (see
# docs/performance_report.md for the human-readable report).
