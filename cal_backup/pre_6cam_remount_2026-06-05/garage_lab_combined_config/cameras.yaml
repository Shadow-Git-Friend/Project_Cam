# Update these each session if /dev/video* changes.
# Prefer /dev/v4l/by-id symlinks if available on your system.
# cam roles must match the garage extrinsics naming.

cameras:
  camNorth:
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:11.1:1.0-video-index0
  camEast:
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:13.1:1.0-video-index0
  camSouth:
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:7.1.1:1.0-video-index0
  camWest:
    device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:5.1.1:1.0-video-index0

# Optional: stable IDs (if present on your OS)
# by_id:
#   camNorth: /dev/v4l/by-id/usb-...
#   camEast: /dev/v4l/by-id/usb-...
#   camSouth: /dev/v4l/by-id/usb-...
#   camWest: /dev/v4l/by-id/usb-...
